name: prisma-deploy

on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lockfile was written by npm 11.20. Node 22's bundled npm rejects its peer entries.
      - run: npm install -g npm@11.20.0
      - uses: oven-sh/setup-bun@v2
      - uses: prisma/cloud-deploy-action@v1
        with:
          build-command: npm run build
        env:
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
