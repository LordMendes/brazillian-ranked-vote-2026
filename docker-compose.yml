services:
  # Local inbox only. Profile "dev" keeps this off a Coolify deploy.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ranked
      POSTGRES_PASSWORD: ranked
      POSTGRES_DB: ranked_choice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranked -d ranked_choice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ranked:ranked@postgres:5432/ranked_choice?schema=public
      SERVER_SECRET: ${SERVER_SECRET:?set SERVER_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOW_NON_BR: ${ALLOW_NON_BR:-}
      VOTING_CLOSES_AT: ${VOTING_CLOSES_AT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Enquete Ranqueada <acesso@tortrad.com.br>}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
